<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNESR · Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231f5fa8%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2717%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27700%27%3EU%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#1f5fa8">
<script>try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="assets/style.css?v=20261121233626">
</head>
<body>
<main>
  <h1>UNESR</h1>
  <p class="sub">Universidad Nacional Experimental Simón Rodríguez · Administración mención Informática · <a href="https://sga.unesr.edu.ve/#/" target="_blank" rel="noopener">SGA ↗</a></p>

  <h2>Lapso actual</h2>
  <section class="mats" id="actual"></section>

  <section class="card">
    <h2>Historial de lapsos</h2>
    <div id="historial"></div>
  </section>

  <footer>Apuntes y guías en <a href="https://github.com/krojasalfaro7/UNESR">github.com/krojasalfaro7/UNESR</a>. Datos del portal en <code>lapsos.js</code>.</footer>
</main>
<script src="lapsos.js?v=20261121233626"></script>
<script>
(function () {
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const actual = LAPSOS.find(l => l.estado === "en curso");
  if (actual) {
    document.getElementById("actual").innerHTML =
      `<a class="mat" href="${actual.url}"><b>Semestre ${esc(actual.id)}</b><span>${actual.nucleo ? "Núcleo " + esc(actual.nucleo) + " · " : ""}${actual.materias.map(m => esc(m.nombre)).join(" · ")}</span></a>`;
  }
  const materia = m => {
    const nombre = (m.codigo ? esc(m.codigo) + " · " : "") + esc(m.nombre);
    return `<li>${m.url ? `<a href="${m.url}">${nombre}</a>` : nombre}${m.nota ? ` <span class="muted">· ${esc(m.nota)}</span>` : ""}</li>`;
  };
  document.getElementById("historial").innerHTML = LAPSOS.map(l => `
    <h3>${l.url ? `<a href="${l.url}">${esc(l.id)}</a>` : esc(l.id)}
      <small class="muted">${[l.estado, l.nucleo && "Núcleo " + l.nucleo].filter(Boolean).map(esc).join(" · ")}</small></h3>
    <ul>${l.materias.map(materia).join("")}</ul>`).join("");
})();
</script>
</body>
</html>
